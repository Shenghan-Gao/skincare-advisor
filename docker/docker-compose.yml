# Usage, from the repository root:
#   make docker-up
# or, manually:
#   docker compose --project-directory . -f docker/docker-compose.yml up --build
#
# A .env file is not required: every variable below has a default, so a fresh
# clone starts cleanly. When a .env is present at the repo root it is picked up
# automatically, which is what local development uses to override these values.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["8000:8000"]
    environment:
      USE_MOCKS: "${USE_MOCKS:-1}"
      USE_MOCK_RETRIEVAL: "${USE_MOCK_RETRIEVAL:-0}"
      USE_STUB_GENERATOR: "${USE_STUB_GENERATOR:-0}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_BASE_MODEL: "${LLM_BASE_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
      LLM_ADAPTER: "${LLM_ADAPTER:-}"
    volumes:
      - ../models:/app/models:ro
      - ../data/processed:/app/data/processed:ro

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
