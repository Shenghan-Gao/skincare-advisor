[project]
name = "skincare-advisor"
version = "0.1.0"
description = "AI skin analysis + post-trained LLM skincare advisor (Gen AI course project)"
requires-python = ">=3.10"

# Core: enough to run the API in mock mode. Keeps teammates unblocked.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "scikit-learn>=1.4", "pillow>=10.2", "matplotlib>=3.8", "pyyaml>=6.0"]
rag    = ["sentence-transformers>=2.6", "faiss-cpu>=1.8", "openai>=1.30"]
llm    = ["transformers>=4.40", "peft>=0.10", "trl>=0.9", "accelerate>=0.30", "datasets>=2.19", "bitsandbytes>=0.43"]
ui     = ["streamlit>=1.33", "requests>=2.31"]
dev    = ["pytest>=8.1", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
